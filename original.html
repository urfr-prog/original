<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADAM · Bac à sable paysage v1</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─── ADAM · bac à sable PAYSAGE ────────────────────────────────────────────
   Prisme à 4 faces. Chaque face = un plateau 4×4 (graphisme repris de v58 :
   cellule arrondie + liseré). Le prisme bascule autour de X : le plateau du
   HAUT descend vers l'avant jusqu'au centre. Gravité incluse par colonne pour
   avoir de la matière qui tombe. Rien d'autre : pas de portes, pas de fusion.
   ─────────────────────────────────────────────────────────────────────────── */

const COLS=7, ROWS=4, TOTAL=COLS*ROWS, CELL_W=1.0, NFACES=4;
const FACE_W=COLS*CELL_W, FACE_H=ROWS*CELL_W, HALF=FACE_H/2;
// 4 faces régulières → demi-angle π/4 ; rayon pour que les faces se touchent.
const RADIUS = HALF/Math.tan(Math.PI/4);          // bascule sur X → on cale sur la HAUTEUR
const FACE_ANG = 2*Math.PI/NFACES;                // 90° entre faces

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const dir=new THREE.DirectionalLight(0xffffff,0.35); dir.position.set(0,2,4); scene.add(dir);

const prism=new THREE.Group(); scene.add(prism);

// ─── cellule façon v58 : carré arrondi + liseré ───────────────────────────
const SZ=CELL_W*0.92, RR=0.1, EDGE_W=0.011;
function rrShape(w,h,r){ const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }

const STATE_COL={ white:0xcdd6e4, silver:0x9fb2c8, gold:0xe6c24a, emerald:0x39c98a, cosmic:0x7c5cff };
const STATES=Object.keys(STATE_COL);

function makeCell(state){
  const g=new THREE.Group();
  // corps
  const body=new THREE.Mesh(new THREE.ShapeGeometry(rrShape(SZ,SZ,RR)),
    new THREE.MeshBasicMaterial({color:STATE_COL[state],transparent:true,opacity:0.92}));
  g.add(body);
  // liseré (anneau)
  const frame=new THREE.Shape(); rrShape(SZ,SZ,RR).getPoints(40).forEach((p,i)=>i?frame.lineTo(p.x,p.y):frame.moveTo(p.x,p.y));
  frame.holes.push(rrShape(SZ-2*EDGE_W,SZ-2*EDGE_W,Math.max(0.01,RR-EDGE_W)));
  g.add(new THREE.Mesh(new THREE.ShapeGeometry(frame),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85})));
  return g;
}

// ─── 4 plateaux 4×4, un par face du prisme ─────────────────────────────────
function cellToLocal(col,row){ return { x:(col-(COLS-1)/2)*CELL_W, y:((ROWS-1)/2-row)*CELL_W }; }
const boards=[];   // boards[f][i] = state | null

function buildBoards(){
  for(let f=0;f<NFACES;f++){
    const faceGroup=new THREE.Group();
    // Prisme basculant autour de X. La face ACTIVE doit être en façade (+Z), centrée Y=0,
    // et parfaitement face caméra. On part donc de l'angle 0 = façade, et on monte les autres
    // faces au-dessus (elles redescendront vers toi à la bascule).
    const ang=f*FACE_ANG;                      // f=0 → façade ; f=1 → au-dessus ; etc.
    faceGroup.rotation.x=-ang;                 // incline la face pour qu'elle suive le prisme
    faceGroup.position.set(0, Math.sin(ang)*RADIUS, Math.cos(ang)*RADIUS);  // +Z en façade
    prism.add(faceGroup);

    // remplissage ÉPARS : ~45% de cases occupées, réparties (pas tassées) →
    // la poussée a du sens (vides à combler, files à déplacer, bords où tomber).
    const state=new Array(TOTAL).fill(null);
    for(let k=0;k<TOTAL;k++){ if(Math.random()<0.45) state[k]=STATES[Math.floor(Math.random()*3)]; }
    boards.push(state);
    renderBoard(f,faceGroup);
  }
}

const cellMeshes=[];   // cellMeshes[f] = group of cells, rebuilt on change
function renderBoard(f,faceGroup){
  if(cellMeshes[f]) faceGroup.remove(cellMeshes[f]);
  const holder=new THREE.Group();
  boards[f].forEach((st,i)=>{ if(!st)return;
    const c=makeCell(st); const p=cellToLocal(i%COLS,Math.floor(i/COLS));
    c.position.set(p.x,p.y,0.01); c.userData.idx=i; holder.add(c); });
  faceGroup.add(holder); cellMeshes[f]=holder;
}

// ─── RUBAN CONTINU : les 4 faces forment un ruban vertical enroulé sur le prisme ──
// Un bloc poussé vers le HAUT au bord supérieur franchit l'arête → réapparaît en BAS
// de la face suivante (current+1). Poussé vers le BAS au bord inférieur → en HAUT de
// la face précédente (current-1). Déplacements internes : voisine libre, comme avant.
const DELTA={ left:{dc:-1,dr:0}, right:{dc:1,dr:0}, up:{dc:0,dr:-1}, down:{dc:0,dr:1} };
function inBounds(c,r){ return c>=0&&c<COLS&&r>=0&&r<ROWS; }
const wrap=f=>((f%NFACES)+NFACES)%NFACES;

// glisse le bloc i d'une case dans dir (si voisine libre). Retourne true si déplacé.
function moveBlock(f,i,dir){
  const b=boards[f]; if(!b[i])return false;
  const {dc,dr}=DELTA[dir];
  const c=i%COLS+dc, r=Math.floor(i/COLS)+dr;
  if(!inBounds(c,r) || b[r*COLS+c]) return false;   // hors cadre ou occupée
  b[r*COLS+c]=b[i]; b[i]=null; return true;
}

// transfert d'arête : le bloc passe sur la face voisine du ruban.
// Retourne la face cible si l'arrivée est libre, sinon -1.
function edgeTarget(f,i,dir){
  const col=i%COLS, row=Math.floor(i/COLS);
  if(dir==='up'   && row===0)      { const nf=wrap(f+1); return boards[nf][(ROWS-1)*COLS+col]?-1:nf; }
  if(dir==='down' && row===ROWS-1) { const nf=wrap(f-1); return boards[nf][col]?-1:nf; }
  return -1;
}
// commit logique du franchissement. Retourne la face d'arrivée.
function commitEdge(f,i,dir){
  const col=i%COLS, nf=wrap(dir==='up'?f+1:f-1);
  const ni=dir==='up' ? (ROWS-1)*COLS+col : col;
  boards[nf][ni]=boards[f][i]; boards[f][i]=null; return nf;
}

// ─── bascule du prisme autour de X ─────────────────────────────────────────
let current=0;                 // index du plateau face caméra
let prismAngle=0, targetAngle=0, animating=false;
function tilt(dir){            // dir>0 : plateau du HAUT descend vers toi
  if(animating)return;
  current=((current+dir)%NFACES+NFACES)%NFACES;
  targetAngle += dir*FACE_ANG; // tourne le prisme pour amener la face du dessus en façade
  animating=true;
}

// ─── caméra paysage plein écran (ORTHOGRAPHIQUE → plat garanti, zéro déformation) ───
function fit(){
  const w=innerWidth,h=innerHeight,aspect=w/h;
  renderer.setSize(w,h);
  // On veut que la HAUTEUR du plateau remplisse la hauteur écran (léger air en haut).
  const halfH=(FACE_H*1.02)/2;               // demi-hauteur monde visible
  const halfW=halfH*aspect;                  // largeur déduite de l'aspect (paysage → large)
  camera.left=-halfW; camera.right=halfW;
  camera.top=halfH;   camera.bottom=-halfH;
  // coller la grille en BAS : le centre du plateau actif est en Y≈0.
  // On décale la caméra vers le bas pour que le bord bas de la grille touche le bas écran.
  const lowGap=halfH-(FACE_H/2);             // air total vertical (monde)
  camera.position.set(0, -lowGap, 50);       // viser plus bas → grille descend, collée en bas
  camera.lookAt(0, -lowGap, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize',fit);

// ─── entrées : saisir un bloc + swipe = direction de poussée ───────────────
// pointerdown détermine la case saisie ; pointerup donne la direction (4 sens).
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pickCell(px,py){
  const r=canvas.getBoundingClientRect();
  ndc.x=((px-r.left)/r.width)*2-1; ndc.y=-((py-r.top)/r.height)*2+1;
  raycaster.setFromCamera(ndc,camera);
  // La face active au repos est en façade à z=RADIUS (repère monde), plan normal +Z.
  const pt=new THREE.Vector3();
  raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,0,1),-RADIUS),pt);
  if(!pt)return -1;
  const col=Math.round(pt.x/CELL_W+(COLS-1)/2);
  const row=Math.round((ROWS-1)/2-pt.y/CELL_W);
  if(col<0||col>=COLS||row<0||row>=ROWS)return -1;
  return row*COLS+col;
}
let grabIdx=-1, sx=0, sy=0;

// ─── bascule manuelle : swipe vertical à DEUX doigts fait tourner le ruban ──
let twoActive=false, twoStartY=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2){ twoActive=true; twoStartY=(e.touches[0].clientY+e.touches[1].clientY)/2; }
},{passive:false});
canvas.addEventListener('touchmove',e=>{ if(twoActive) e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend',e=>{
  if(twoActive && e.touches.length<2){
    const t=e.changedTouches[0]; const y=t?t.clientY:twoStartY; const d=y-twoStartY;
    if(Math.abs(d)>40) tilt(d<0 ? 1 : -1);   // 2 doigts vers le HAUT → face du dessus en façade
    twoActive=false; grabIdx=-1;
  }
},{passive:false});
// fallback desktop (tests Mac) : flèches haut/bas = bascule
addEventListener('keydown',e=>{ if(e.key==='ArrowUp')tilt(1); else if(e.key==='ArrowDown')tilt(-1); });

canvas.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; grabIdx=pickCell(e.clientX,e.clientY); });
canvas.addEventListener('pointerup',e=>{
  if(twoActive || animating){ grabIdx=-1; return; }            // gesture 2 doigts ou bascule en cours
  if(grabIdx<0){ grabIdx=-1; return; }
  const dx=e.clientX-sx, dy=e.clientY-sy, TH=24;
  if(Math.abs(dx)<TH && Math.abs(dy)<TH){ grabIdx=-1; return; }   // simple tap → rien
  let dir;
  if(Math.abs(dx)>Math.abs(dy)) dir = dx<0 ? 'left':'right';
  else                          dir = dy<0 ? 'up':'down';
  if(!movingBlock && boards[current][grabIdx]){
    const {dc,dr}=DELTA[dir];
    const c=grabIdx%COLS+dc, r=Math.floor(grabIdx/COLS)+dr;
    if(inBounds(c,r) && !boards[current][c+r*COLS]){
      startBlockMove(current, grabIdx, c+r*COLS, dir);          // déplacement interne
    } else if(edgeTarget(current,grabIdx,dir)>=0){
      startEdgeMove(current, grabIdx, dir);                     // franchit l'arête du ruban
    }
  }
  grabIdx=-1;
});

// ─── animation du BLOC déplacé (on voit la pièce glisser vers sa voisine) ────
let movingBlock=null;   // { kind, face, fromIdx, dir, mesh, t, from, to }
function startBlockMove(f, fromIdx, toIdx, dir){
  const holder=cellMeshes[f]; if(!holder){ moveBlock(f,fromIdx,dir); renderBoard(f,prism.children[f]); return; }
  const mesh=holder.children.find(ch=>ch.userData.idx===fromIdx);
  if(!mesh){ moveBlock(f,fromIdx,dir); renderBoard(f,prism.children[f]); return; }
  const a=cellToLocal(fromIdx%COLS,Math.floor(fromIdx/COLS));
  const b=cellToLocal(toIdx%COLS,Math.floor(toIdx/COLS));
  movingBlock={ kind:'move', face:f, fromIdx, dir, mesh, t:0, from:{x:a.x,y:a.y}, to:{x:b.x,y:b.y} };
}

// le bloc glisse au-delà du bord (haut ou bas) puis est livré à la face voisine du ruban.
function startEdgeMove(f, fromIdx, dir){
  const holder=cellMeshes[f]; if(!holder){ commitEdge(f,fromIdx,dir); renderBoard(f,prism.children[f]); return; }
  const mesh=holder.children.find(ch=>ch.userData.idx===fromIdx);
  if(!mesh){ commitEdge(f,fromIdx,dir); renderBoard(f,prism.children[f]); return; }
  const a=cellToLocal(fromIdx%COLS,Math.floor(fromIdx/COLS));
  const dy=(dir==='up'?1:-1)*CELL_W*1.2;                     // sort par le bord
  movingBlock={ kind:'edge', face:f, fromIdx, dir, mesh, t:0, from:{x:a.x,y:a.y}, to:{x:a.x,y:a.y+dy} };
}

// ─── boucle ────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if(animating){
    prismAngle += (targetAngle-prismAngle)*0.16;
    if(Math.abs(targetAngle-prismAngle)<0.001){ prismAngle=targetAngle; animating=false; }
    prism.rotation.x=prismAngle;
  }
  if(movingBlock){
    const mb=movingBlock; mb.t += 0.16;
    const e=mb.t>=1?1:1-Math.pow(1-mb.t,3);          // easeOutCubic
    mb.mesh.position.x = mb.from.x+(mb.to.x-mb.from.x)*e;
    mb.mesh.position.y = mb.from.y+(mb.to.y-mb.from.y)*e;
    if(mb.kind==='edge'){ const o=Math.max(0,1-mb.t); mb.mesh.children.forEach(ch=>ch.material&&(ch.material.opacity=o)); }
    if(mb.t>=1){
      if(mb.kind==='edge'){
        const nf=commitEdge(mb.face, mb.fromIdx, mb.dir);  // livré à la face voisine
        renderBoard(mb.face, prism.children[mb.face]);     // retire le bloc de la face active
        renderBoard(nf,       prism.children[nf]);         // l'affiche sur la voisine (à découvrir en basculant)
      } else {
        moveBlock(mb.face, mb.fromIdx, mb.dir);            // déplacement interne
        renderBoard(mb.face, prism.children[mb.face]);
      }
      movingBlock=null;
    }
  }
  renderer.render(scene,camera);
}

buildBoards(); fit(); animate();
</script>
</body>
</html>
