<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADAM · Bac à sable paysage v1</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─── ADAM · bac à sable PAYSAGE ────────────────────────────────────────────
   Prisme à 4 faces. Chaque face = un plateau 4×4 (graphisme repris de v58 :
   cellule arrondie + liseré). Le prisme bascule autour de X : le plateau du
   HAUT descend vers l'avant jusqu'au centre. Gravité incluse par colonne pour
   avoir de la matière qui tombe. Rien d'autre : pas de portes, pas de fusion.
   ─────────────────────────────────────────────────────────────────────────── */

const COLS=7, ROWS=4, TOTAL=COLS*ROWS, CELL_W=1.0, NFACES=1;
const FACE_W=COLS*CELL_W, FACE_H=ROWS*CELL_W, HALF=FACE_H/2;
const RADIUS = 0;                                 // mono-face : plat, pas de prisme
const FACE_ANG = 2*Math.PI/4;
const LEVEL_LEN = 50;                             // longueur du couloir (colonnes)

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const dir=new THREE.DirectionalLight(0xffffff,0.35); dir.position.set(0,2,4); scene.add(dir);

const prism=new THREE.Group(); scene.add(prism);

// ─── cellule façon v58 : carré arrondi + liseré ───────────────────────────
const SZ=CELL_W*0.92, RR=0.1, EDGE_W=0.011;
function rrShape(w,h,r){ const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }

// ─── ICÔNES (portées de v58, viewBox 0 0 90 90) — seul critère de fusion ───
const ICO={
 chevron:{d:'M20 32L45 12L70 32',t:'path'},
 circle:{d:'45,22,12',t:'circle'},
 line:{d:'15,22,75,22',t:'line'},
 wave:{d:'M 29 22 Q 29 12 37 12 Q 45 12 45 22 Q 45 32 53 32 Q 61 32 61 22 Q 61 12 53 12 Q 45 12 45 22 Q 45 32 37 32 Q 29 32 29 22 Z',t:'path'}
};
const ICONS=Object.keys(ICO);          // 4 icônes : chevron/wave/line/circle
const ICON_COL='rgba(205,214,228,0.95)';

function icoSVG(name){ const d=ICO[name]; if(!d)return'';
 if(d.t==='path')  return `<path class="i" d="${d.d}"/>`;
 if(d.t==='circle'){const[cx,cy,r]=d.d.split(',');return `<circle class="i" cx="${cx}" cy="${cy}" r="${r}"/>`;}
 if(d.t==='line')  {const[x1,y1,x2,y2]=d.d.split(',');return `<line class="i" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
 return''; }

// Texture domino façon STACK : dalle noire arrondie, DEUX icônes (haut/bas),
// fine médiane de séparation. Pas d'état, pas de couleur. La PAIRE d'icônes
// (haut+bas) est le critère de fusion.
const _texCache={};
function getDominoTex(top,bot){
 const key=top+'|'+bot; if(_texCache[key]) return _texCache[key];
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <style>.i{stroke:${ICON_COL};stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;}
         .s{stroke:rgba(160,170,190,0.28);stroke-width:1.2;}</style>
  <line class="s" x1="14" y1="45" x2="76" y2="45"/>
  <g>${icoSVG(top)}</g>
  <g transform="translate(0,45)">${icoSVG(bot)}</g></svg>`;
 const S=256, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
 const ctx=cv.getContext('2d');
 const tex=new THREE.CanvasTexture(cv); tex.needsUpdate=false;
 const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const img=new Image();
 img.onload=()=>{ const m=4,rd=36;
  ctx.fillStyle='rgba(0,0,0,0.95)';
  ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.fill();
  ctx.drawImage(img,m+2,m+2,S-m*2-4,S-m*2-4);
  tex.needsUpdate=true;URL.revokeObjectURL(url); };
 img.src=url; _texCache[key]=tex; return tex;
}

// Un domino = objet {top,bot}. clé d'identité fusion = "top|bot".
const dKey=d=>d.top+'|'+d.bot;
function makeDomino(){ const a=ICONS[Math.floor(Math.random()*ICONS.length)],
                            b=ICONS[Math.floor(Math.random()*ICONS.length)]; return {top:a,bot:b}; }

// makeCell(v) : v est soit un domino {top,bot}, soit '#' (mur), soit null.
function makeCell(v){
  const g=new THREE.Group();
  const HIT=SZ+0.04;
  const hit=new THREE.Mesh(new THREE.PlaneGeometry(HIT,HIT),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  hit.position.z=-0.001; g.add(hit);
  if(v==='#'){
    const body=new THREE.Mesh(new THREE.ShapeGeometry(rrShape(SZ,SZ,RR)),
      new THREE.MeshBasicMaterial({color:0x2a2c34,transparent:true,opacity:0.96}));
    g.add(body);
    const frame=new THREE.Shape(); rrShape(SZ,SZ,RR).getPoints(40).forEach((p,i)=>i?frame.lineTo(p.x,p.y):frame.moveTo(p.x,p.y));
    frame.holes.push(rrShape(SZ-2*EDGE_W,SZ-2*EDGE_W,Math.max(0.01,RR-EDGE_W)));
    g.add(new THREE.Mesh(new THREE.ShapeGeometry(frame),
      new THREE.MeshBasicMaterial({color:0x55596a,transparent:true,opacity:0.8})));
    return g;
  }
  const face=new THREE.Mesh(new THREE.PlaneGeometry(SZ,SZ),
    new THREE.MeshBasicMaterial({map:getDominoTex(v.top,v.bot),transparent:true}));
  g.add(face);
  const frame=new THREE.Shape(); rrShape(SZ,SZ,RR).getPoints(40).forEach((p,i)=>i?frame.lineTo(p.x,p.y):frame.moveTo(p.x,p.y));
  frame.holes.push(rrShape(SZ-2*EDGE_W,SZ-2*EDGE_W,Math.max(0.01,RR-EDGE_W)));
  g.add(new THREE.Mesh(new THREE.ShapeGeometry(frame),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85})));
  return g;
}

// ─── 1 plateau visible 7×4, alimenté par un couloir de 50 colonnes ─────────
function cellToLocal(col,row){ return { x:(col-(COLS-1)/2)*CELL_W, y:((ROWS-1)/2-row)*CELL_W }; }
const boards=[];   // boards[0][i] = domino{top,bot} | '#' | null

// ── LE COULOIR : 50 colonnes dessinées à la main (4 lignes de haut). ────────
// '#'=mur, '.'=vide, 'D'=domino aléatoire. Chambres, chicanes, goulets.
const LEVEL_ART=[
 "..#....##....#......#..##....#....##......#...##...",
 "DD..DD..D..DD..DDD..D..DD..DD..D..DD..DDD..D..DD..D",
 "DD..DD..D..DD..DDD..D..DD..DD..D..DD..DDD..D..DD..D",
 "..#....##....#......#..##....#....##......#...##...",
];
// matrice level[row][col] de longueur LEVEL_LEN
const level=[];
for(let r=0;r<ROWS;r++){ const row=[];
  for(let c=0;c<LEVEL_LEN;c++){ const ch=LEVEL_ART[r][c]||'.';
    row.push(ch==='#'?'#':(ch==='D'?makeDomino():null)); }
  level.push(row); }
let scrollCol=0;   // colonne de gauche de la fenêtre visible dans le couloir

function colFromLevel(c){ // renvoie la colonne (tableau ROWS) du couloir à l'indice c (cyclique)
  const cc=((c%LEVEL_LEN)+LEVEL_LEN)%LEVEL_LEN;
  const out=[]; for(let r=0;r<ROWS;r++){ const v=level[r][cc]; out.push(v==='#'?'#':(v?{top:v.top,bot:v.bot}:null)); }
  return out;
}

function buildBoards(){
  const faceGroup=new THREE.Group();
  faceGroup.position.set(0,0,0);
  prism.add(faceGroup);
  // charge la fenêtre initiale (7 premières colonnes du couloir)
  const state=new Array(TOTAL).fill(null);
  for(let c=0;c<COLS;c++){ const col=colFromLevel(scrollCol+c);
    for(let r=0;r<ROWS;r++){ state[r*COLS+c]=col[r]; } }
  boards.push(state);
  renderBoard(0,faceGroup);
}

const cellMeshes=[];   // cellMeshes[f] = group of cells, rebuilt on change
// extraCol : si fourni, dessine une colonne supplémentaire À DROITE (la colonne neuve
// qui va entrer), pour que le glissement la fasse apparaître en douceur.
// extraCol : colonne entrante. extraSide='right' → dessinée hors cadre à droite (col=COLS) ;
// extraSide='left' → hors cadre à gauche (col=-1).
function renderBoard(f,faceGroup,extraCol,extraSide){
  if(cellMeshes[f]) faceGroup.remove(cellMeshes[f]);
  const holder=new THREE.Group();
  boards[f].forEach((st,i)=>{ if(!st)return;
    const c=makeCell(st); const p=cellToLocal(i%COLS,Math.floor(i/COLS));
    c.position.set(p.x,p.y,0.01); c.userData.idx=i; holder.add(c); });
  if(extraCol){
    if(extraSide==='left'||extraSide==='right'){
      const xcol=(extraSide==='left')?-1:COLS;
      for(let r=0;r<ROWS;r++){ const st=extraCol[r]; if(!st)continue;
        const c=makeCell(st); const p=cellToLocal(xcol,r);
        c.position.set(p.x,p.y,0.01); holder.add(c); }
    } else { // 'top' ou 'bottom' → ligne entrante hors cadre
      const xrow=(extraSide==='top')?-1:ROWS;
      for(let cc=0;cc<COLS;cc++){ const st=extraCol[cc]; if(!st)continue;
        const c=makeCell(st); const p=cellToLocal(cc,xrow);
        c.position.set(p.x,p.y,0.01); holder.add(c); }
    } }
  faceGroup.add(holder); cellMeshes[f]=holder;
}

// La colonne neuve qui entre = la colonne suivante du COULOIR (défilement gauche).
function newColumn(){ scrollCol++; return colFromLevel(scrollCol+COLS-1); }
function newLine(){ const line=new Array(COLS).fill(null); return line; } // haut/bas désactivés

// ─── helpers labyrinthe ────────────────────────────────────────────────────
const isWall =v=>v==='#';
const isDomino=v=>v!=null && v!=='#';

// ─── GRAVITÉ : tous les dominos tombent dans le sens 'grav' jusqu'à buter ────
// (mur, autre domino arrêté, ou bord). Les murs ne bougent JAMAIS.
// grav ∈ 'down'/'up'/'left'/'right'. Retourne la liste {from,to} des dominos déplacés.
function applyGravity(f,grav){
  const b=boards[f];
  const moves=[];
  const horizontal=(grav==='left'||grav==='right');
  if(horizontal){
    const step=(grav==='right')?-1:1;     // on parcourt depuis le bord d'arrivée
    for(let r=0;r<ROWS;r++){
      // case d'atterrissage courante, en partant du bord vers lequel ça tombe
      let target=(grav==='right')?COLS-1:0;
      const order=[];
      if(grav==='right'){ for(let c=COLS-1;c>=0;c--) order.push(c); }
      else              { for(let c=0;c<COLS;c++)   order.push(c); }
      for(const c of order){ const i=r*COLS+c; const v=b[i];
        if(isWall(v)){ target=c+step; continue; }      // mur : reset l'atterrissage juste après
        if(isDomino(v)){
          if(c!==target){ b[r*COLS+target]=v; b[i]=null; moves.push({from:i,to:r*COLS+target}); }
          target+=step;
        }
      }
    }
  } else {
    const step=(grav==='down')?-1:1;
    for(let c=0;c<COLS;c++){
      let target=(grav==='down')?ROWS-1:0;
      const order=[];
      if(grav==='down'){ for(let r=ROWS-1;r>=0;r--) order.push(r); }
      else             { for(let r=0;r<ROWS;r++)    order.push(r); }
      for(const r of order){ const i=r*COLS+c; const v=b[i];
        if(isWall(v)){ target=r+step; continue; }
        if(isDomino(v)){
          if(r!==target){ b[target*COLS+c]=v; b[i]=null; moves.push({from:i,to:target*COLS+c}); }
          target+=step;
        }
      }
    }
  }
  return moves;
}

// ─── FUSION (icône seule, sans état) : cascade v58 dégraissée ───────────────
// Priorité : CHAÎNE à 3 (centre matché des 2 côtés) → FUSION simple (2 adjacents)
//            → AIMANT (paire séparée par couloir vide).
// Une fusion fait TOUJOURS perdre un domino : le survivant reste tel quel.
// Retourne un objet décrivant la fusion à animer, ou null si rien.
function neigh(b,i,dir){ const c=i%COLS,r=Math.floor(i/COLS);
  if(dir==='left') return c>0?i-1:-1;
  if(dir==='right')return c<COLS-1?i+1:-1;
  if(dir==='up')   return r>0?i-COLS:-1;
  if(dir==='down') return r<ROWS-1?i+COLS:-1;
  return -1; }

// couloir vide (que des null) entre deux index alignés
function corridorEmpty(b,i1,i2,horizontal){
  if(horizontal){ const y=Math.floor(i1/COLS); for(let c=(i1%COLS)+1;c<i2%COLS;c++){ if(b[y*COLS+c]!=null)return false; } }
  else { const x=i1%COLS; for(let r=Math.floor(i1/COLS)+1;r<Math.floor(i2/COLS);r++){ if(b[r*COLS+x]!=null)return false; } }
  return true;
}

function findFusion(f){
  const b=boards[f];
  const same=(p,q)=>isDomino(p)&&isDomino(q)&&dKey(p)===dKey(q);
  // 1) CHAÎNE à 3 : un centre dont les deux opposés ont la même paire d'icônes.
  for(let i=0;i<TOTAL;i++){ const c=b[i]; if(!isDomino(c))continue;
    const x=i%COLS,y=Math.floor(i/COLS);
    if(x>0&&x<COLS-1){ if(same(b[i-1],c)&&same(b[i+1],c)) return {type:'chain',axis:'h',center:i,a:i-1,bb:i+1}; }
    if(y>0&&y<ROWS-1){ if(same(b[i-COLS],c)&&same(b[i+COLS],c)) return {type:'chain',axis:'v',center:i,a:i-COLS,bb:i+COLS}; }
  }
  // 2) FUSION simple : deux dominos adjacents, même paire.
  for(let i=0;i<TOTAL;i++){ const c=b[i]; if(!isDomino(c))continue;
    const R=neigh(b,i,'right'); if(R!==-1&&same(b[R],c)) return {type:'simple',axis:'h',a:i,bb:R};
    const D=neigh(b,i,'down');  if(D!==-1&&same(b[D],c)) return {type:'simple',axis:'v',a:i,bb:D};
  }
  // 3) AIMANT : paire identique séparée par couloir vide.
  for(let i=0;i<TOTAL;i++){ const c=b[i]; if(!isDomino(c))continue;
    const x=i%COLS,y=Math.floor(i/COLS);
    for(let c2=x+1;c2<COLS;c2++){ const j=y*COLS+c2; const v=b[j]; if(v==null)continue;
      if(same(v,c) && corridorEmpty(b,i,j,true)) return {type:'magnet',axis:'h',a:i,bb:j};
      break; }
    for(let r2=y+1;r2<ROWS;r2++){ const j=r2*COLS+x; const v=b[j]; if(v==null)continue;
      if(same(v,c) && corridorEmpty(b,i,j,false)) return {type:'magnet',axis:'v',a:i,bb:j};
      break; }
  }
  return null;
}

// commit logique du défilement, selon le sens.
// 'left'  : décale à gauche, colonne neuve à DROITE.
// 'right' : décale à droite, colonne neuve à GAUCHE.
function commitScroll(f,fresh,dir){
  const b=boards[f];
  if(dir==='right'){
    for(let r=0;r<ROWS;r++){
      for(let c=COLS-1;c>0;c--){ b[r*COLS+c]=b[r*COLS+c-1]; }   // décale à droite
      b[r*COLS+0]=fresh[r];                                      // colonne neuve à gauche
    }
  } else if(dir==='left'){
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS-1;c++){ b[r*COLS+c]=b[r*COLS+c+1]; }   // décale à gauche
      b[r*COLS+(COLS-1)]=fresh[r];                              // colonne neuve à droite
    }
  } else if(dir==='down'){
    for(let c=0;c<COLS;c++){
      for(let r=ROWS-1;r>0;r--){ b[r*COLS+c]=b[(r-1)*COLS+c]; } // décale vers le bas
      b[0*COLS+c]=fresh[c];                                      // ligne neuve en haut
    }
  } else { // up
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS-1;r++){ b[r*COLS+c]=b[(r+1)*COLS+c]; } // décale vers le haut
      b[(ROWS-1)*COLS+c]=fresh[c];                              // ligne neuve en bas
    }
  }
}

// ─── mono-face statique (plus de bascule prisme) ───────────────────────────
let current=0;
let prismAngle=0, targetAngle=0, animating=false, tiltT=0, tiltFrom=0;

// ─── caméra paysage plein écran (ORTHOGRAPHIQUE → plat garanti, zéro déformation) ───
function fit(){
  const w=innerWidth,h=innerHeight,aspect=w/h;
  renderer.setSize(w,h);
  // On veut que la HAUTEUR du plateau remplisse la hauteur écran (léger air en haut).
  const halfH=(FACE_H*1.02)/2;               // demi-hauteur monde visible
  const halfW=halfH*aspect;                  // largeur déduite de l'aspect (paysage → large)
  camera.left=-halfW; camera.right=halfW;
  camera.top=halfH;   camera.bottom=-halfH;
  // coller la grille en BAS : le centre du plateau actif est en Y≈0.
  // On décale la caméra vers le bas pour que le bord bas de la grille touche le bas écran.
  const lowGap=halfH-(FACE_H/2);             // air total vertical (monde)
  camera.position.set(0, -lowGap, 50);       // viser plus bas → grille descend, collée en bas
  camera.lookAt(0, -lowGap, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize',fit);

// ─── entrées : SWIPE HORIZONTAL = sens de la gravité (couloir) ─────────────
// Haut/bas désactivés (c'est un couloir). Swipe gauche/droite → les dominos
// glissent jusqu'à buter (mur/domino/bord), puis les fusions s'enchaînent.
let sx=0, sy=0;
canvas.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; });
canvas.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx, dy=e.clientY-sy, TH=24;
  if(busy) return;
  if(Math.abs(dx)<TH) return;                         // pas de swipe horizontal net
  if(Math.abs(dy)>Math.abs(dx)) return;               // swipe vertical ignoré
  const grav = dx<0 ? 'left' : 'right';
  startGravity(current, grav);
});

// ─── ANIMATION DE GLISSEMENT (déplacement de meshes from→to) ───────────────
const MOVE_DUR=0.16, FUSE_DUR=0.16, TILT_DUR=0.30;
let busy=false;                                       // verrou pendant une cascade
let anim=null;   // { kind:'move'|'fuse', items:[{mesh,from:{x,y},to:{x,y}}], t, after }
let lastT=0;

function meshAt(holder,idx){ return holder.children.find(ch=>ch.userData.idx===idx); }

// Anime une liste de mouvements {from,to} (board DÉJÀ à jour), puis appelle `after`.
function animateMoves(f, moves, after){
  const holder=cellMeshes[f];
  if(!holder || !moves || !moves.length){ after&&after(); return; }
  const items=[];
  for(const mv of moves){
    const mesh=meshAt(holder,mv.from); if(!mesh) continue;
    mesh.userData.idx=mv.to; mesh.position.z=0.04;
    const a=cellToLocal(mv.from%COLS,Math.floor(mv.from/COLS));
    const b=cellToLocal(mv.to%COLS,Math.floor(mv.to/COLS));
    items.push({mesh,from:{x:a.x,y:a.y},to:{x:b.x,y:b.y}});
  }
  if(!items.length){ after&&after(); return; }
  anim={ kind:'move', dur:MOVE_DUR, items, t:0, after };
}

// ─── CASCADE : gravité → fusion → gravité → … jusqu'à stabilité, puis défile ─
function startGravity(f, grav){
  busy=true;
  const moves=applyGravity(f, grav);
  animateMoves(f, moves, ()=>{ renderBoard(f, prism.children[f]); resolveFusions(f, grav); });
}

function resolveFusions(f, grav){
  const fu=findFusion(f);
  if(!fu){ endCascade(f, grav); return; }
  const b=boards[f];
  // Le SURVIVANT : pour chaîne, c'est le centre ; pour simple/aimant, c'est `a`.
  const survivor = (fu.type==='chain') ? fu.center : fu.a;
  const losers   = (fu.type==='chain') ? [fu.a, fu.bb] : [fu.bb];
  // anime les perdants qui glissent vers le survivant (aimant : trajet long ; sinon court)
  const holder=cellMeshes[f];
  const items=[];
  const sLoc=cellToLocal(survivor%COLS,Math.floor(survivor/COLS));
  for(const L of losers){
    const mesh=meshAt(holder,L); if(!mesh) continue;
    const a=cellToLocal(L%COLS,Math.floor(L/COLS));
    items.push({mesh,from:{x:a.x,y:a.y},to:{x:sLoc.x,y:sLoc.y},fade:true});
  }
  // applique la fusion au board : les perdants disparaissent (on perd un domino)
  for(const L of losers) b[L]=null;
  anim={ kind:'fuse', dur:FUSE_DUR, items, t:0, after:()=>{
    renderBoard(f, prism.children[f]);
    // après une fusion, des vides sont apparus → re-gravité puis on recherche encore
    const mv=applyGravity(f, grav);
    animateMoves(f, mv, ()=>{ renderBoard(f, prism.children[f]); resolveFusions(f, grav); });
  }};
}

// Fin de cascade : le COULOIR défile d'un cran vers la gauche (montre la suite),
// quelle que soit la gravité. Une colonne neuve du niveau entre à droite.
function endCascade(f, grav){
  startSlide(f, 'left', ()=>{ busy=false; });
}

// ─── DÉFILEMENT (tapis roulant) — sens = celui de la gravité ───────────────
let sliding=false, slideFresh=null, slideFace=0, slideT=0, slideDir='down', slideAfter=null;
function startSlide(f,dir,after){
  slideDir=dir||'down'; slideAfter=after||null;
  const vertical=(slideDir==='up'||slideDir==='down');
  let side;
  if(vertical){ slideFresh=newLine();  side=(slideDir==='down')?'top':'bottom'; }
  else        { slideFresh=newColumn(); side=(slideDir==='right')?'left':'right'; }
  renderBoard(f, prism.children[f], slideFresh, side);
  slideT=0; slideFace=f; sliding=true;
}

// ─── boucle ────────────────────────────────────────────────────────────────
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastT)/1000||0, 0.05); lastT=now;
  if(animating){
    tiltT += dt/TILT_DUR;
    const tt=tiltT>=1?1:tiltT;
    const e=1-Math.pow(1-tt,3);
    prismAngle = tiltFrom+(targetAngle-tiltFrom)*e;
    if(tiltT>=1){ prismAngle=targetAngle; animating=false; }
    prism.rotation.x=prismAngle;
  }
  if(anim){
    anim.t += dt/anim.dur;
    const tt=anim.t>=1?1:anim.t;
    const e=1-Math.pow(1-tt,3);
    for(const it of anim.items){
      it.mesh.position.x = it.from.x+(it.to.x-it.from.x)*e;
      it.mesh.position.y = it.from.y+(it.to.y-it.from.y)*e;
      if(it.fade){ it.mesh.traverse(o=>{ if(o.material&&o.material.opacity!==undefined){ o.material.transparent=true; o.material.opacity=Math.max(0,1-tt); } }); }
    }
    if(anim.t>=1){ const after=anim.after; anim=null; after&&after(); }
  }
  if(sliding){
    slideT += dt/MOVE_DUR/2.2;
    const tt=slideT>=1?1:slideT;
    const e=1-Math.pow(1-tt,3);
    const vertical=(slideDir==='up'||slideDir==='down');
    const holder=cellMeshes[slideFace];
    if(vertical){ const sign=(slideDir==='down')?-1:1; if(holder){ holder.position.y=sign*CELL_W*e; holder.position.x=0; } }
    else        { const sign=(slideDir==='right')?1:-1; if(holder){ holder.position.x=sign*CELL_W*e; holder.position.y=0; } }
    if(slideT>=1){
      commitScroll(slideFace, slideFresh, slideDir);
      if(holder){ holder.position.x=0; holder.position.y=0; }
      renderBoard(slideFace, prism.children[slideFace]);
      sliding=false; slideFresh=null;
      const after=slideAfter; slideAfter=null; after&&after();
    }
  }
  renderer.render(scene,camera);
}

buildBoards(); fit(); lastT=performance.now(); requestAnimationFrame(animate);
</script>
</body>
</html>
