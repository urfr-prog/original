<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADAM · Bac à sable paysage v1</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─── ADAM · bac à sable PAYSAGE ────────────────────────────────────────────
   Prisme à 4 faces. Chaque face = un plateau 4×4 (graphisme repris de v58 :
   cellule arrondie + liseré). Le prisme bascule autour de X : le plateau du
   HAUT descend vers l'avant jusqu'au centre. Gravité incluse par colonne pour
   avoir de la matière qui tombe. Rien d'autre : pas de portes, pas de fusion.
   ─────────────────────────────────────────────────────────────────────────── */

const COLS=7, ROWS=4, TOTAL=COLS*ROWS, CELL_W=1.0, NFACES=4;
const FACE_W=COLS*CELL_W, FACE_H=ROWS*CELL_W, HALF=FACE_H/2;
// 4 faces régulières → demi-angle π/4 ; rayon pour que les faces se touchent.
const RADIUS = HALF/Math.tan(Math.PI/4);          // bascule sur X → on cale sur la HAUTEUR
const FACE_ANG = 2*Math.PI/NFACES;                // 90° entre faces

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const dir=new THREE.DirectionalLight(0xffffff,0.35); dir.position.set(0,2,4); scene.add(dir);

const prism=new THREE.Group(); scene.add(prism);

// ─── cellule façon v58 : carré arrondi + liseré ───────────────────────────
const SZ=CELL_W*0.92, RR=0.1, EDGE_W=0.011;
function rrShape(w,h,r){ const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }

const STATE_COL={ white:0xcdd6e4, silver:0x9fb2c8, gold:0xe6c24a, emerald:0x39c98a, cosmic:0x7c5cff };
const STATES=Object.keys(STATE_COL);

function makeCell(state){
  const g=new THREE.Group();
  // hitbox invisible : calée sur la matière visible (+ fine marge), pas sur toute la case,
  // pour qu'elle ne déborde pas sur le carré voisin (sinon le haut attrape celui du dessus).
  const HIT=SZ+0.04;
  const hit=new THREE.Mesh(new THREE.PlaneGeometry(HIT,HIT),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  hit.position.z=-0.001; g.add(hit);
  // corps
  const body=new THREE.Mesh(new THREE.ShapeGeometry(rrShape(SZ,SZ,RR)),
    new THREE.MeshBasicMaterial({color:STATE_COL[state],transparent:true,opacity:0.92}));
  g.add(body);
  // liseré (anneau)
  const frame=new THREE.Shape(); rrShape(SZ,SZ,RR).getPoints(40).forEach((p,i)=>i?frame.lineTo(p.x,p.y):frame.moveTo(p.x,p.y));
  frame.holes.push(rrShape(SZ-2*EDGE_W,SZ-2*EDGE_W,Math.max(0.01,RR-EDGE_W)));
  g.add(new THREE.Mesh(new THREE.ShapeGeometry(frame),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85})));
  return g;
}

// ─── 4 plateaux 4×4, un par face du prisme ─────────────────────────────────
function cellToLocal(col,row){ return { x:(col-(COLS-1)/2)*CELL_W, y:((ROWS-1)/2-row)*CELL_W }; }
const boards=[];   // boards[f][i] = state | null

function buildBoards(){
  for(let f=0;f<NFACES;f++){
    const faceGroup=new THREE.Group();
    // Prisme basculant autour de X. La face ACTIVE doit être en façade (+Z), centrée Y=0,
    // et parfaitement face caméra. On part donc de l'angle 0 = façade, et on monte les autres
    // faces au-dessus (elles redescendront vers toi à la bascule).
    const ang=f*FACE_ANG;                      // f=0 → façade ; f=1 → au-dessus ; etc.
    faceGroup.rotation.x=-ang;                 // incline la face pour qu'elle suive le prisme
    faceGroup.position.set(0, Math.sin(ang)*RADIUS, Math.cos(ang)*RADIUS);  // +Z en façade
    prism.add(faceGroup);

    // remplissage ÉPARS : ~45% de cases occupées, réparties (pas tassées) →
    // la poussée a du sens (vides à combler, files à déplacer, bords où tomber).
    const state=new Array(TOTAL).fill(null);
    for(let k=0;k<TOTAL;k++){ if(Math.random()<0.45) state[k]=STATES[Math.floor(Math.random()*3)]; }
    boards.push(state);
    renderBoard(f,faceGroup);
  }
}

const cellMeshes=[];   // cellMeshes[f] = group of cells, rebuilt on change
// extraCol : si fourni, dessine une colonne supplémentaire À DROITE (la colonne neuve
// qui va entrer), pour que le glissement la fasse apparaître en douceur.
// extraCol : colonne entrante. extraSide='right' → dessinée hors cadre à droite (col=COLS) ;
// extraSide='left' → hors cadre à gauche (col=-1).
function renderBoard(f,faceGroup,extraCol,extraSide){
  if(cellMeshes[f]) faceGroup.remove(cellMeshes[f]);
  const holder=new THREE.Group();
  boards[f].forEach((st,i)=>{ if(!st)return;
    const c=makeCell(st); const p=cellToLocal(i%COLS,Math.floor(i/COLS));
    c.position.set(p.x,p.y,0.01); c.userData.idx=i; holder.add(c); });
  if(extraCol){ const xcol=(extraSide==='left')?-1:COLS;
    for(let r=0;r<ROWS;r++){ const st=extraCol[r]; if(!st)continue;
      const c=makeCell(st); const p=cellToLocal(xcol,r);
      c.position.set(p.x,p.y,0.01); holder.add(c); } }
  faceGroup.add(holder); cellMeshes[f]=holder;
}

// ─── DÉROULÉ : bouger un bloc fait AVANCER le plateau d'un cran vers la gauche ──
// 1) glisser un bloc sur une case voisine libre ;
// 2) tout le plateau glisse d'1 colonne vers la GAUCHE (colonne 0 sort du cadre) ;
// 3) une nouvelle colonne est générée à droite.
const DELTA={ left:{dc:-1,dr:0}, right:{dc:1,dr:0}, up:{dc:0,dr:-1}, down:{dc:0,dr:1} };
function inBounds(c,r){ return c>=0&&c<COLS&&r>=0&&r<ROWS; }

function newColumn(){
  const col=new Array(ROWS).fill(null);
  for(let r=0;r<ROWS;r++){ if(Math.random()<0.45) col[r]=STATES[Math.floor(Math.random()*3)]; }
  return col;
}

// glisse le bloc i d'une case dans dir (si voisine libre). Retourne true si déplacé.
function moveBlock(f,i,dir){
  const b=boards[f]; if(!b[i])return false;
  const {dc,dr}=DELTA[dir];
  const c=i%COLS+dc, r=Math.floor(i/COLS)+dr;
  if(!inBounds(c,r) || b[r*COLS+c]) return false;   // hors cadre ou occupée
  b[r*COLS+c]=b[i]; b[i]=null; return true;
}

// commit logique du défilement, selon le sens.
// 'left'  : décale à gauche, colonne neuve à DROITE.
// 'right' : décale à droite, colonne neuve à GAUCHE.
function commitScroll(f,fresh,dir){
  const b=boards[f];
  if(dir==='right'){
    for(let r=0;r<ROWS;r++){
      for(let c=COLS-1;c>0;c--){ b[r*COLS+c]=b[r*COLS+c-1]; }   // décale à droite
      b[r*COLS+0]=fresh[r];                                      // colonne neuve à gauche
    }
  } else {
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS-1;c++){ b[r*COLS+c]=b[r*COLS+c+1]; }   // décale à gauche
      b[r*COLS+(COLS-1)]=fresh[r];                              // colonne neuve à droite
    }
  }
}

// ─── bascule du prisme autour de X ─────────────────────────────────────────
let current=0;                 // index du plateau face caméra
let prismAngle=0, targetAngle=0, animating=false, tiltT=0, tiltFrom=0;
function tilt(dir){            // dir>0 : plateau du HAUT descend vers toi
  if(animating)return;
  current=((current+dir)%NFACES+NFACES)%NFACES;
  tiltFrom=prismAngle; tiltT=0;
  targetAngle += dir*FACE_ANG; // tourne le prisme pour amener la face du dessus en façade
  animating=true;
}

// ─── caméra paysage plein écran (ORTHOGRAPHIQUE → plat garanti, zéro déformation) ───
function fit(){
  const w=innerWidth,h=innerHeight,aspect=w/h;
  renderer.setSize(w,h);
  // On veut que la HAUTEUR du plateau remplisse la hauteur écran (léger air en haut).
  const halfH=(FACE_H*1.02)/2;               // demi-hauteur monde visible
  const halfW=halfH*aspect;                  // largeur déduite de l'aspect (paysage → large)
  camera.left=-halfW; camera.right=halfW;
  camera.top=halfH;   camera.bottom=-halfH;
  // coller la grille en BAS : le centre du plateau actif est en Y≈0.
  // On décale la caméra vers le bas pour que le bord bas de la grille touche le bas écran.
  const lowGap=halfH-(FACE_H/2);             // air total vertical (monde)
  camera.position.set(0, -lowGap, 50);       // viser plus bas → grille descend, collée en bas
  camera.lookAt(0, -lowGap, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize',fit);

// ─── entrées : saisir un bloc + swipe = direction de poussée ───────────────
// pointerdown détermine la case saisie ; pointerup donne la direction (4 sens).
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pickCell(px,py){
  const r=canvas.getBoundingClientRect();
  ndc.x=((px-r.left)/r.width)*2-1; ndc.y=-((py-r.top)/r.height)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const holder=cellMeshes[current]; if(!holder) return -1;
  // Raycast DIRECT sur les cellules de la face active → exact, insensible au décalage caméra.
  const hits=raycaster.intersectObjects(holder.children,true);
  if(!hits.length) return -1;
  // remonte jusqu'au groupe-cellule qui porte userData.idx
  let o=hits[0].object;
  while(o && o.userData.idx===undefined){ o=o.parent; }
  return (o && o.userData.idx!==undefined) ? o.userData.idx : -1;
}
let grabIdx=-1, sx=0, sy=0, grabMesh=null;
function setGrab(idx){
  grabMesh=null;
  const holder=cellMeshes[current]; if(!holder)return;
  const m=holder.children.find(ch=>ch.userData.idx===idx);
  if(m){ grabMesh=m; m.position.z=0.06; m.scale.set(1.08,1.08,1); }  // feedback instantané
}
function releaseGrab(){
  if(grabMesh){ grabMesh.position.z=0.01; grabMesh.scale.set(1,1,1); grabMesh=null; }
}
canvas.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; grabIdx=pickCell(e.clientX,e.clientY); if(grabIdx>=0&&!sliding&&!movingBlock)setGrab(grabIdx); });
canvas.addEventListener('pointerup',e=>{
  releaseGrab();
  if(grabIdx<0){ grabIdx=-1; return; }
  const dx=e.clientX-sx, dy=e.clientY-sy, TH=12;
  if(Math.abs(dx)<TH){ grabIdx=-1; return; }            // pas de swipe horizontal → rien
  // deux sens : swipe à GAUCHE → bloc à gauche ; swipe à DROITE → bloc à droite.
  const dir = dx<0 ? 'left' : 'right';
  // si la case voisine est libre : on ANIME d'abord le bloc vers elle, puis le plateau défile.
  if(!sliding && !movingBlock){
    const {dc,dr}=DELTA[dir];
    const c=grabIdx%COLS+dc, r=Math.floor(grabIdx/COLS)+dr;
    if(inBounds(c,r) && !boards[current][c+r*COLS]){
      startBlockMove(current, grabIdx, c+r*COLS, dir);
    }
  }
  grabIdx=-1;
});
canvas.addEventListener('pointercancel',()=>{ releaseGrab(); grabIdx=-1; });

// ─── animation du BLOC déplacé (on voit la pièce glisser vers sa voisine) ────
let movingBlock=null;   // { face, fromIdx, toIdx, mesh, t, from:{x,y}, to:{x,y} }
const MOVE_DUR=0.14, SLIDE_DUR=0.34, TILT_DUR=0.30;   // bloc vif, défilement plus lent → mouvements distincts
let lastT=0;
function startBlockMove(f, fromIdx, toIdx, dir){
  const holder=cellMeshes[f]; if(!holder){ moveBlock(f,fromIdx,dir); startSlide(f,dir); return; }
  const mesh=holder.children.find(ch=>ch.userData.idx===fromIdx);
  if(!mesh){ moveBlock(f,fromIdx,dir); startSlide(f,dir); return; }
  mesh.scale.set(1,1,1); mesh.position.z=0.04;        // bloc en mouvement reste légèrement au-dessus
  const a=cellToLocal(fromIdx%COLS,Math.floor(fromIdx/COLS));
  const b=cellToLocal(toIdx%COLS,Math.floor(toIdx/COLS));
  movingBlock={ face:f, fromIdx, toIdx, dir, mesh, t:0, from:{x:a.x,y:a.y}, to:{x:b.x,y:b.y} };
}

// ─── animation du défilement (glissement doux, sens = celui du déplacement) ──
let sliding=false, slideX=0, slideFresh=null, slideFace=0, slideT=0, slideDir='left';
function startSlide(f,dir){
  slideDir=dir||'left';
  slideFresh=newColumn();
  const side=(slideDir==='right')?'left':'right';   // colonne neuve à l'opposé du défilement
  renderBoard(f, prism.children[f], slideFresh, side);
  slideX=0; slideT=0; slideFace=f; sliding=true;
}

// ─── boucle ────────────────────────────────────────────────────────────────
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastT)/1000||0, 0.05); lastT=now;
  if(animating){
    tiltT += dt/TILT_DUR;
    const tt=tiltT>=1?1:tiltT;
    const e=1-Math.pow(1-tt,3);                       // easeOutCubic
    prismAngle = tiltFrom+(targetAngle-tiltFrom)*e;
    if(tiltT>=1){ prismAngle=targetAngle; animating=false; }
    prism.rotation.x=prismAngle;
  }
  if(movingBlock){
    const mb=movingBlock; mb.t += dt/MOVE_DUR;
    const tt=mb.t>=1?1:mb.t;
    const e=1-Math.pow(1-tt,3);                       // easeOutCubic
    mb.mesh.position.x = mb.from.x+(mb.to.x-mb.from.x)*e;
    mb.mesh.position.y = mb.from.y+(mb.to.y-mb.from.y)*e;
    if(mb.t>=1){
      moveBlock(mb.face, mb.fromIdx, mb.dir);          // commit logique du déplacement
      movingBlock=null;
      startSlide(slideFace=mb.face, mb.dir);           // puis le plateau défile dans le même sens
    }
  }
  if(sliding){
    slideT += dt/SLIDE_DUR;
    const tt=slideT>=1?1:slideT;
    const e=1-Math.pow(1-tt,3);                       // easeOutCubic
    const sign=(slideDir==='right')?1:-1;            // droite → glisse vers +x ; gauche → -x
    slideX = sign*CELL_W*e;
    const holder=cellMeshes[slideFace];
    if(holder) holder.position.x = slideX;
    if(slideT>=1){                                    // fin du glissement
      commitScroll(slideFace, slideFresh, slideDir);
      if(holder) holder.position.x = 0;
      renderBoard(slideFace, prism.children[slideFace]);
      sliding=false; slideFresh=null;
    }
  }
  renderer.render(scene,camera);
}

buildBoards(); fit(); lastT=performance.now(); requestAnimationFrame(animate);
</script>
</body>
</html>
