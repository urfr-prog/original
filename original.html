<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADAM · Bac à sable paysage v1</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─── ADAM · bac à sable PAYSAGE ────────────────────────────────────────────
   Prisme à 4 faces. Chaque face = un plateau 4×4 (graphisme repris de v58 :
   cellule arrondie + liseré). Le prisme bascule autour de X : le plateau du
   HAUT descend vers l'avant jusqu'au centre. Gravité incluse par colonne pour
   avoir de la matière qui tombe. Rien d'autre : pas de portes, pas de fusion.
   ─────────────────────────────────────────────────────────────────────────── */

const COLS=9, ROWS=5, TOTAL=COLS*ROWS, CELL_W=1.0, NFACES=1;
const FACE_W=COLS*CELL_W, FACE_H=ROWS*CELL_W, HALF=FACE_H/2;
const RADIUS = 0;                                 // mono-face : plat, pas de prisme
const FACE_ANG = 2*Math.PI/4;
const LEVEL_LEN = 50;                             // longueur du couloir (colonnes)

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const dir=new THREE.DirectionalLight(0xffffff,0.35); dir.position.set(0,2,4); scene.add(dir);

const prism=new THREE.Group(); scene.add(prism);

// ─── cellule façon v58 : carré arrondi + liseré ───────────────────────────
const SZ=CELL_W*0.92, RR=0.1, EDGE_W=0.011;
function rrShape(w,h,r){ const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }

// ═══ GRAPHISME EXACT DE STACK v58 (porté verbatim) ════════════════════════
// ICO : chaque icône a une face1 et une face2 (deux dessins distincts).
const ICO={
 chevron:{f1:'M20 32L45 12L70 32',f2:'M20 12L45 32L70 12',t:'path'},
 circle:{f1:'45,22,12',f2:'45,22,12',t:'circle'},
 line:{f1:'15,22,75,22',f2:'15,22,75,22',t:'line'},
 wave:{f1:'M 29 22 Q 29 12 37 12 Q 45 12 45 22 Q 45 32 53 32 Q 61 32 61 22 Q 61 12 53 12 Q 45 12 45 22 Q 45 32 37 32 Q 29 32 29 22 Z',f2:'M 29 22 Q 29 12 37 12 Q 45 12 45 22 Q 45 32 53 32 Q 61 32 61 22 Q 61 12 53 12 Q 45 12 45 22 Q 45 32 37 32 Q 29 32 29 22 Z',t:'path'}
};
const ICONS=Object.keys(ICO);
function renderIcoSVG(name,f2){
 const d=ICO[name]; if(!d)return''; const data=f2?d.f2:d.f1;
 if(d.t==='path')return`<path class="i" d="${data}"/>`;
 if(d.t==='circle'){const[cx,cy,r]=data.split(',');return`<circle class="i" cx="${cx}" cy="${cy}" r="${r}"/>`;}
 if(d.t==='line'){const[x1,y1,x2,y2]=data.split(',');return`<line class="i" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
 return'';
}
// Palette STC de v58 (portée). On force l'état NEUTRE 'white' partout (pas de couleur).
const STC={
 white:{border:'rgba(210,210,220,0.5)',icon:'rgba(210,210,220,0.5)',pt:'rgba(210,210,220,0.5)',sep:'rgba(210,210,220,0.4)',flt:'',bw:1}
};
const _texCache={};
let showMedians=true;   // médiane VERTICALE : face1 à GAUCHE, face2 à DROITE
// getDominoTex porté de v58, adapté médiane verticale (faces exposées gauche/droite).
function getDominoTex(f1,f2,rot){
 const state='white';
 const k=f1+'|'+f2+'|'+rot+'|'+state+'|'+(showMedians?'V':''); if(_texCache[k])return _texCache[k];
 const c=STC[state], r=((rot||0)%360+360)%360;
 const ic=c.icon, iw=2;
 const lft=renderIcoSVG(f1,false), rgt=renderIcoSVG(f2,true);
 // chaque glyphe (boîte ~x15-75,y12-32) est recentré puis comprimé dans sa moitié.
 const inner=`${showMedians?'<line class="s" x1="45" y1="0" x2="45" y2="90"/>':''}`
  +`<g transform="translate(0,22) scale(0.5,1)">${lft}</g>`
  +`<g transform="translate(45,22) scale(0.5,1)">${rgt}</g>`;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <style>.i{stroke:${ic};stroke-width:${iw*1.6};stroke-linecap:round;stroke-linejoin:round;fill:none;}.p{fill:${ic};}.s{stroke:${c.sep};stroke-width:1}</style>
  <g transform="rotate(${r},45,45)">${inner}</g></svg>`;
 const S=256, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
 const ctx=cv.getContext('2d');
 const tex=new THREE.CanvasTexture(cv); tex.needsUpdate=false;
 const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const img=new Image();
 img.onload=()=>{ const m=4,rd=36;
  ctx.fillStyle='rgba(0,0,0,0.95)';
  ctx.beginPath();ctx.moveTo(m+rd,m);ctx.lineTo(S-m-rd,m);ctx.quadraticCurveTo(S-m,m,S-m,m+rd);ctx.lineTo(S-m,S-m-rd);ctx.quadraticCurveTo(S-m,S-m,S-m-rd,S-m);ctx.lineTo(m+rd,S-m);ctx.quadraticCurveTo(m,S-m,m,S-m-rd);ctx.lineTo(m,m+rd);ctx.quadraticCurveTo(m,m,m+rd,m);ctx.closePath();ctx.fill();
  ctx.drawImage(img,m+2,m+2,S-m*2-4,S-m*2-4);
  tex.needsUpdate=true;URL.revokeObjectURL(url); };
 img.src=url; _texCache[k]=tex; return tex;
}

// Un domino = {f1, f2, rot}. Identité de fusion = paire de faces (rot indépendante ici).
const dKey=d=>d.f1+'|'+d.f2;
function makeDomino(){ const a=ICONS[Math.floor(Math.random()*ICONS.length)],
                            b=ICONS[Math.floor(Math.random()*ICONS.length)];
  return {f1:a,f2:b,rot:0}; }

// makeCell(v) : domino {f1,f2,rot}, ou '#' (cube-obstacle), ou null.
function makeCell(v){
  const g=new THREE.Group();
  const HIT=SZ+0.04;
  const hit=new THREE.Mesh(new THREE.PlaneGeometry(HIT,HIT),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  hit.position.z=-0.001; g.add(hit);
  if(v==='#'){
    // CUBE-OBSTACLE de plateau : dalle pierre légèrement plus petite, en relief.
    const CB=SZ*0.86;
    const body=new THREE.Mesh(new THREE.ShapeGeometry(rrShape(CB,CB,RR*0.7)),
      new THREE.MeshBasicMaterial({color:0x3a3d47,transparent:true,opacity:0.98}));
    g.add(body);
    const frame=new THREE.Shape(); rrShape(CB,CB,RR*0.7).getPoints(40).forEach((p,i)=>i?frame.lineTo(p.x,p.y):frame.moveTo(p.x,p.y));
    frame.holes.push(rrShape(CB-2*EDGE_W*1.6,CB-2*EDGE_W*1.6,Math.max(0.01,RR*0.7-EDGE_W)));
    g.add(new THREE.Mesh(new THREE.ShapeGeometry(frame),
      new THREE.MeshBasicMaterial({color:0x6b7080,transparent:true,opacity:0.9})));
    return g;
  }
  const face=new THREE.Mesh(new THREE.PlaneGeometry(SZ,SZ),
    new THREE.MeshBasicMaterial({map:getDominoTex(v.f1,v.f2,v.rot||0),transparent:true}));
  g.add(face);
  const frame=new THREE.Shape(); rrShape(SZ,SZ,RR).getPoints(40).forEach((p,i)=>i?frame.lineTo(p.x,p.y):frame.moveTo(p.x,p.y));
  frame.holes.push(rrShape(SZ-2*EDGE_W,SZ-2*EDGE_W,Math.max(0.01,RR-EDGE_W)));
  g.add(new THREE.Mesh(new THREE.ShapeGeometry(frame),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85})));
  return g;
}

// ─── 1 plateau visible 7×4, alimenté par un couloir de 50 colonnes ─────────
function cellToLocal(col,row){ return { x:(col-(COLS-1)/2)*CELL_W, y:((ROWS-1)/2-row)*CELL_W }; }
const boards=[];   // boards[0][i] = domino{top,bot} | '#' | null

// ── LE PLATEAU : 50 colonnes (4 lignes), OUVERT, parsemé de cubes-obstacles. ─
// Comme un jeu de plateau : pas de chambres fermées, des CUBES isolés ('#') qui
// stoppent l'élan des dominos quand ils glissent. Les dominos filent jusqu'à
// buter sur un cube, un autre domino ou le bord.
//   '#' = cube-obstacle    '.' = case libre
//   lettres = domino avec une PAIRE de faces fixe (pour des fusions contrôlées) :
//   '#'=cube-obstacle  '.'=libre
//   Dominos notés par un chiffre = paire de faces {f1(gauche), f2(droite)} :
//     Avec médiane verticale, A fusionne avec son voisin DROIT B si A.f2 == B.f1.
//     On compose donc des dominos qui s'enchaînent par les faces.
//     1={wave,chevron} 2={chevron,line} 3={line,circle} 4={circle,wave}
//     5={chevron,chevron} 6={wave,wave}   (paires pleines, fusionnent entre elles)
//   Exemples de fusion : 1 suivi de 2 → face droite 'chevron' = face gauche 'chevron'.
const PAIR={
 '1':['wave','chevron'], '2':['chevron','line'], '3':['line','circle'],
 '4':['circle','wave'],  '5':['chevron','chevron'], '6':['wave','wave']
};
const LEVEL_ART=[
 "##.#####.#####.#####.#####.#####.#####.#####.#####",
 "3..4..1..#..5..6..1#.3..2..4.#5..1..2..#..3..4...#",
 "12..#34..55..1#23..66..2#34..1.4..#5.5..21..#3..66",
 "4..1..2..#..6..5..2#.1..4..3.#1..5..6..#..3..1...#",
 "#####.#####.#####.#####.#####.#####.#####.#####.##",
];
const level=[];
for(let r=0;r<ROWS;r++){ const row=[];
  for(let c=0;c<LEVEL_LEN;c++){ const ch=(LEVEL_ART[r][c]||'.');
    if(ch==='#') row.push('#');
    else if(ch==='D') row.push(makeDomino());
    else if(PAIR[ch]){ const[a,b]=PAIR[ch]; row.push({f1:a,f2:b,rot:0}); }
    else row.push(null); }
  level.push(row); }
let scrollCol=0;

function colFromLevel(c){
  const cc=((c%LEVEL_LEN)+LEVEL_LEN)%LEVEL_LEN;
  const out=[]; for(let r=0;r<ROWS;r++){ const v=level[r][cc];
    out.push(v==='#'?'#':(v?{f1:v.f1,f2:v.f2,rot:v.rot||0}:null)); }
  return out;
}

function buildBoards(){
  const faceGroup=new THREE.Group();
  faceGroup.position.set(0,0,0);
  prism.add(faceGroup);
  // charge la fenêtre initiale (7 premières colonnes du couloir)
  const state=new Array(TOTAL).fill(null);
  for(let c=0;c<COLS;c++){ const col=colFromLevel(scrollCol+c);
    for(let r=0;r<ROWS;r++){ state[r*COLS+c]=col[r]; } }
  boards.push(state);
  renderBoard(0,faceGroup);
}

const cellMeshes=[];   // cellMeshes[f] = group of cells, rebuilt on change
// extraCol : si fourni, dessine une colonne supplémentaire À DROITE (la colonne neuve
// qui va entrer), pour que le glissement la fasse apparaître en douceur.
// extraCol : colonne entrante. extraSide='right' → dessinée hors cadre à droite (col=COLS) ;
// extraSide='left' → hors cadre à gauche (col=-1).
function renderBoard(f,faceGroup,extraCol,extraSide){
  if(cellMeshes[f]) faceGroup.remove(cellMeshes[f]);
  const holder=new THREE.Group();
  boards[f].forEach((st,i)=>{ if(!st)return;
    const c=makeCell(st); const p=cellToLocal(i%COLS,Math.floor(i/COLS));
    c.position.set(p.x,p.y,0.01); c.userData.idx=i; holder.add(c); });
  if(extraCol){
    if(extraSide==='left'||extraSide==='right'){
      const xcol=(extraSide==='left')?-1:COLS;
      for(let r=0;r<ROWS;r++){ const st=extraCol[r]; if(!st)continue;
        const c=makeCell(st); const p=cellToLocal(xcol,r);
        c.position.set(p.x,p.y,0.01); holder.add(c); }
    } else { // 'top' ou 'bottom' → ligne entrante hors cadre
      const xrow=(extraSide==='top')?-1:ROWS;
      for(let cc=0;cc<COLS;cc++){ const st=extraCol[cc]; if(!st)continue;
        const c=makeCell(st); const p=cellToLocal(cc,xrow);
        c.position.set(p.x,p.y,0.01); holder.add(c); }
    } }
  faceGroup.add(holder); cellMeshes[f]=holder;
}

// Colonne neuve qui entre, selon le sens de progression dans le couloir.
//  advance: la fenêtre montre [scrollCol .. scrollCol+COLS-1].
//  - défilement 'left'  (on progresse) → scrollCol++ ; neuve = bord droit.
//  - défilement 'right' (on recule)    → scrollCol-- ; neuve = bord gauche.
function newColumn(slideDir){
  if(slideDir==='right'){ scrollCol--; return colFromLevel(scrollCol); }
  scrollCol++; return colFromLevel(scrollCol+COLS-1);
}
function newLine(){ const line=new Array(COLS).fill(null); return line; }

// ─── helpers labyrinthe ────────────────────────────────────────────────────
const isWall =v=>v==='#';
const isDomino=v=>v!=null && v!=='#';

// ─── GRAVITÉ : tous les dominos tombent dans le sens 'grav' jusqu'à buter ────
// (mur, autre domino arrêté, ou bord). Les murs ne bougent JAMAIS.
// grav ∈ 'down'/'up'/'left'/'right'. Retourne la liste {from,to} des dominos déplacés.
function applyGravity(f,grav){
  const b=boards[f];
  const moves=[];
  const horizontal=(grav==='left'||grav==='right');
  if(horizontal){
    const step=(grav==='right')?-1:1;     // on parcourt depuis le bord d'arrivée
    for(let r=0;r<ROWS;r++){
      // case d'atterrissage courante, en partant du bord vers lequel ça tombe
      let target=(grav==='right')?COLS-1:0;
      const order=[];
      if(grav==='right'){ for(let c=COLS-1;c>=0;c--) order.push(c); }
      else              { for(let c=0;c<COLS;c++)   order.push(c); }
      for(const c of order){ const i=r*COLS+c; const v=b[i];
        if(isWall(v)){ target=c+step; continue; }      // mur : reset l'atterrissage juste après
        if(isDomino(v)){
          if(c!==target){ b[r*COLS+target]=v; b[i]=null; moves.push({from:i,to:r*COLS+target}); }
          target+=step;
        }
      }
    }
  } else {
    const step=(grav==='down')?-1:1;
    for(let c=0;c<COLS;c++){
      let target=(grav==='down')?ROWS-1:0;
      const order=[];
      if(grav==='down'){ for(let r=ROWS-1;r>=0;r--) order.push(r); }
      else             { for(let r=0;r<ROWS;r++)    order.push(r); }
      for(const r of order){ const i=r*COLS+c; const v=b[i];
        if(isWall(v)){ target=r+step; continue; }
        if(isDomino(v)){
          if(r!==target){ b[target*COLS+c]=v; b[i]=null; moves.push({from:i,to:target*COLS+c}); }
          target+=step;
        }
      }
    }
  }
  return moves;
}

// ═══ FUSION — VRAIE CASCADE DE STACK v58, portée fidèlement ════════════════
// Adaptation unique : médiane VERTICALE → face1 exposée à GAUCHE, face2 à DROITE
// (à plat, rot 0). Aucune face exposée en haut/bas : seul l'axe horizontal fusionne,
// exactement comme Stack où seul l'axe des faces exposées compte.
// Pas d'état, pas de régresseur, pas de porte (retirés). Conserve : twin, chaîne à 3,
// fusion simple, aimant simple, aimant-chaîne bilatéral — et l'ORDRE de priorité de v58.
function getExposedFace(p,dir){
  if(!isDomino(p)) return null;
  const r=(((p.rot||0)%360)+360)%360;
  // médiane verticale : à 0°, face1=gauche, face2=droite ; à 180°, inversé.
  const map={0:{left:'f1',right:'f2'},180:{left:'f2',right:'f1'},
             90:{top:'f1',bottom:'f2'},270:{top:'f2',bottom:'f1'}};
  const f=map[r]&&map[r][dir]; return f?p[f]:null;
}
function corridorEmpty(b,i1,i2,horizontal){
  if(horizontal){ const y=Math.floor(i1/COLS); for(let c=(i1%COLS)+1;c<i2%COLS;c++){ if(b[y*COLS+c]!=null)return false; } }
  else { const x=i1%COLS; for(let r=Math.floor(i1/COLS)+1;r<Math.floor(i2/COLS);r++){ if(b[r*COLS+x]!=null)return false; } }
  return true;
}
// faces au contact coïncident (base de TOUTES les fusions de Stack)
function magnetMatch(a,dirA,b,dirB){
  const fa=getExposedFace(a,dirA), fb=getExposedFace(b,dirB);
  return !!(fa&&fb&&fa===fb);
}
// TWIN : miroir parfait (f1==f1 ET f2==f2), même ligne/colonne, couloir vide.
function findTwinPair(b){
  for(let i=0;i<TOTAL;i++){ const a=b[i]; if(!isDomino(a))continue;
    const x=i%COLS,y=Math.floor(i/COLS);
    for(let c2=x+1;c2<COLS;c2++){ const j=y*COLS+c2; if(b[j]==null)continue;
      const q=b[j]; if(isDomino(q)&&q.f1===a.f1&&q.f2===a.f2&&(q.rot||0)===(a.rot||0)&&corridorEmpty(b,i,j,true)) return {i1:i,i2:j,axis:'h'};
      break; }
    for(let r2=y+1;r2<ROWS;r2++){ const j=r2*COLS+x; if(b[j]==null)continue;
      const q=b[j]; if(isDomino(q)&&q.f1===a.f1&&q.f2===a.f2&&(q.rot||0)===(a.rot||0)&&corridorEmpty(b,i,j,false)) return {i1:i,i2:j,axis:'v'};
      break; }
  }
  return null;
}
// aimant-chaîne bilatéral : un centre qui matche une proie à GAUCHE et à DROITE (couloirs vides)
function nearestMatch(b,iC,dirCenter,dirProie,forward){
  const x=iC%COLS,y=Math.floor(iC/COLS);
  if(forward){ for(let c=x+1;c<COLS;c++){ const j=y*COLS+c; if(b[j]!=null){ return (magnetMatch(b[iC],dirCenter,b[j],dirProie)&&corridorEmpty(b,iC,j,true))?j:-1; } } }
  else       { for(let c=x-1;c>=0;c--){ const j=y*COLS+c; if(b[j]!=null){ return (magnetMatch(b[j],dirProie,b[iC],dirCenter)&&corridorEmpty(b,j,iC,true))?j:-1; } } }
  return -1;
}
function findChainMagnet(b){
  for(let iC=0;iC<TOTAL;iC++){ const c=b[iC]; if(!isDomino(c))continue;
    const lf=nearestMatch(b,iC,'left','right',false);
    const rg=nearestMatch(b,iC,'right','left',true);
    if(lf!==-1&&rg!==-1) return {iLo:lf,iC,iHi:rg};
  }
  return null;
}

// findFusion : reproduit l'ORDRE EXACT de checkFusions de v58 (sans régresseur/porte).
//   twin → chaîne adjacente à 3 → fusion simple → aimant-chaîne bilatéral → aimant simple
function findFusion(f){
  const b=boards[f];
  // TWIN (miroir parfait)
  { const tp=findTwinPair(b); if(tp){ return {type:'twin',axis:tp.axis,a:tp.i1,bb:tp.i2}; } }
  // CHAÎNE ADJACENTE À 3 (centre matché des deux côtés) — horizontal uniquement (médiane V)
  for(let i=0;i<TOTAL;i++){ const c=b[i]; if(!isDomino(c))continue; const x=i%COLS;
    if(x>0&&x<COLS-1){ const iL=i-1,iR=i+1;
      if(isDomino(b[iL])&&isDomino(b[iR])){
        const a=getExposedFace(b[iL],'right'), bb=getExposedFace(c,'left');
        const e=getExposedFace(c,'right'),     ff=getExposedFace(b[iR],'left');
        if(a&&bb&&a===bb&&e&&ff&&e===ff) return {type:'chain',axis:'h',center:i,a:iL,bb:iR};
      }
    }
  }
  // FUSION SIMPLE (contact horizontal, faces exposées coïncident)
  for(let i=0;i<TOTAL;i++){ if(!isDomino(b[i]))continue; const x=i%COLS;
    const iR=(x<COLS-1)?i+1:-1;
    if(iR!==-1&&isDomino(b[iR])){
      const fL=getExposedFace(b[i],'right'), fR=getExposedFace(b[iR],'left');
      if(fL&&fR&&fL===fR) return {type:'simple',axis:'h',a:i,bb:iR};
    }
  }
  // AIMANT-CHAÎNE BILATÉRAL (priorité sur l'aimant simple)
  { const cm=findChainMagnet(b); if(cm){ return {type:'chainmagnet',axis:'h',center:cm.iC,a:cm.iLo,bb:cm.iHi}; } }
  // AIMANT SIMPLE (paire à distance, couloir vide)
  for(let i=0;i<TOTAL;i++){ const c=b[i]; if(!isDomino(c))continue; const x=i%COLS,y=Math.floor(i/COLS);
    for(let c2=x+1;c2<COLS;c2++){ const j=y*COLS+c2; if(b[j]==null)continue;
      if(magnetMatch(c,'right',b[j],'left')&&corridorEmpty(b,i,j,true)) return {type:'magnet',axis:'h',a:i,bb:j};
      break; }
  }
  return null;
}

// commit logique du défilement, selon le sens.
// 'left'  : décale à gauche, colonne neuve à DROITE.
// 'right' : décale à droite, colonne neuve à GAUCHE.
function commitScroll(f,fresh,dir){
  const b=boards[f];
  if(dir==='right'){
    for(let r=0;r<ROWS;r++){
      for(let c=COLS-1;c>0;c--){ b[r*COLS+c]=b[r*COLS+c-1]; }   // décale à droite
      b[r*COLS+0]=fresh[r];                                      // colonne neuve à gauche
    }
  } else if(dir==='left'){
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS-1;c++){ b[r*COLS+c]=b[r*COLS+c+1]; }   // décale à gauche
      b[r*COLS+(COLS-1)]=fresh[r];                              // colonne neuve à droite
    }
  } else if(dir==='down'){
    for(let c=0;c<COLS;c++){
      for(let r=ROWS-1;r>0;r--){ b[r*COLS+c]=b[(r-1)*COLS+c]; } // décale vers le bas
      b[0*COLS+c]=fresh[c];                                      // ligne neuve en haut
    }
  } else { // up
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS-1;r++){ b[r*COLS+c]=b[(r+1)*COLS+c]; } // décale vers le haut
      b[(ROWS-1)*COLS+c]=fresh[c];                              // ligne neuve en bas
    }
  }
}

// ─── mono-face statique (plus de bascule prisme) ───────────────────────────
let current=0;
let prismAngle=0, targetAngle=0, animating=false, tiltT=0, tiltFrom=0;

// ─── caméra paysage plein écran (ORTHOGRAPHIQUE → plat garanti, zéro déformation) ───
function fit(){
  const w=innerWidth,h=innerHeight,aspect=w/h;
  renderer.setSize(w,h);
  // On veut que la HAUTEUR du plateau remplisse la hauteur écran (léger air en haut).
  const halfH=(FACE_H*1.02)/2;               // demi-hauteur monde visible
  const halfW=halfH*aspect;                  // largeur déduite de l'aspect (paysage → large)
  camera.left=-halfW; camera.right=halfW;
  camera.top=halfH;   camera.bottom=-halfH;
  // coller la grille en BAS : le centre du plateau actif est en Y≈0.
  // On décale la caméra vers le bas pour que le bord bas de la grille touche le bas écran.
  const lowGap=halfH-(FACE_H/2);             // air total vertical (monde)
  camera.position.set(0, -lowGap, 50);       // viser plus bas → grille descend, collée en bas
  camera.lookAt(0, -lowGap, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize',fit);

// ─── entrées : SWIPE 4 SENS = gravité ──────────────────────────────────────
// Les 4 sens font glisser les dominos (butée mur/domino/bord). Gauche/droite
// font AUSSI avancer le couloir (défilement horizontal). Haut/bas : gravité
// pure, bords fermés, pas de défilement vertical.
let sx=0, sy=0;
canvas.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; });
canvas.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx, dy=e.clientY-sy, TH=24;
  if(busy) return;
  if(Math.abs(dx)<TH && Math.abs(dy)<TH) return;       // pas de swipe net
  let grav;
  if(Math.abs(dx)>=Math.abs(dy)) grav = dx<0 ? 'left' : 'right';
  else                           grav = dy<0 ? 'up' : 'down';
  startGravity(current, grav);
});

// ─── ANIMATION DE GLISSEMENT (déplacement de meshes from→to) ───────────────
const MOVE_DUR=0.16, FUSE_DUR=0.16, TILT_DUR=0.30;
let busy=false;                                       // verrou pendant une cascade
let anim=null;   // { kind:'move'|'fuse', items:[{mesh,from:{x,y},to:{x,y}}], t, after }
let lastT=0;

function meshAt(holder,idx){ return holder.children.find(ch=>ch.userData.idx===idx); }

// Anime une liste de mouvements {from,to} (board DÉJÀ à jour), puis appelle `after`.
function animateMoves(f, moves, after){
  const holder=cellMeshes[f];
  if(!holder || !moves || !moves.length){ after&&after(); return; }
  const items=[];
  for(const mv of moves){
    const mesh=meshAt(holder,mv.from); if(!mesh) continue;
    mesh.userData.idx=mv.to; mesh.position.z=0.04;
    const a=cellToLocal(mv.from%COLS,Math.floor(mv.from/COLS));
    const b=cellToLocal(mv.to%COLS,Math.floor(mv.to/COLS));
    items.push({mesh,from:{x:a.x,y:a.y},to:{x:b.x,y:b.y}});
  }
  if(!items.length){ after&&after(); return; }
  anim={ kind:'move', dur:MOVE_DUR, items, t:0, after };
}

// ─── CASCADE : gravité → fusion → gravité → … jusqu'à stabilité, puis défile ─
function startGravity(f, grav){
  busy=true;
  const moves=applyGravity(f, grav);
  animateMoves(f, moves, ()=>{ renderBoard(f, prism.children[f]); resolveFusions(f, grav); });
}

function resolveFusions(f, grav){
  const fu=findFusion(f);
  if(!fu){ endCascade(f, grav); return; }
  const b=boards[f];
  // SURVIVANT : chaîne/aimant-chaîne → centre ; sinon → a. PERDANTS : le reste.
  const isChain = (fu.type==='chain'||fu.type==='chainmagnet');
  const survivor = isChain ? fu.center : fu.a;
  const losers   = isChain ? [fu.a, fu.bb] : [fu.bb];
  const holder=cellMeshes[f];
  const items=[];
  const sLoc=cellToLocal(survivor%COLS,Math.floor(survivor/COLS));
  for(const L of losers){
    const mesh=meshAt(holder,L); if(!mesh) continue;
    const a=cellToLocal(L%COLS,Math.floor(L/COLS));
    items.push({mesh,from:{x:a.x,y:a.y},to:{x:sLoc.x,y:sLoc.y},fade:true});
  }
  for(const L of losers) b[L]=null;          // on perd un (ou deux) domino(s)
  anim={ kind:'fuse', dur:FUSE_DUR, items, t:0, after:()=>{
    renderBoard(f, prism.children[f]);
    const mv=applyGravity(f, grav);
    animateMoves(f, mv, ()=>{ renderBoard(f, prism.children[f]); resolveFusions(f, grav); });
  }};
}

// Fin de cascade : seuls les swipes HORIZONTAUX font avancer le couloir.
//  - 'right' : on progresse (le couloir défile vers la gauche, colonne neuve à droite)
//  - 'left'  : on recule (défile vers la droite, colonne neuve à gauche)
//  - 'up'/'down' : gravité pure, bords fermés, AUCUN défilement.
function endCascade(f, grav){
  if(grav==='right'){ startSlide(f,'left',()=>{ busy=false; }); }
  else if(grav==='left'){ startSlide(f,'right',()=>{ busy=false; }); }
  else { busy=false; }                                  // haut/bas : rien ne défile
}

// ─── DÉFILEMENT (tapis roulant) — sens = celui de la gravité ───────────────
let sliding=false, slideFresh=null, slideFace=0, slideT=0, slideDir='down', slideAfter=null;
function startSlide(f,dir,after){
  slideDir=dir||'down'; slideAfter=after||null;
  const vertical=(slideDir==='up'||slideDir==='down');
  let side;
  if(vertical){ slideFresh=newLine();  side=(slideDir==='down')?'top':'bottom'; }
  else        { slideFresh=newColumn(slideDir); side=(slideDir==='right')?'left':'right'; }
  renderBoard(f, prism.children[f], slideFresh, side);
  slideT=0; slideFace=f; sliding=true;
}

// ─── boucle ────────────────────────────────────────────────────────────────
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastT)/1000||0, 0.05); lastT=now;
  if(animating){
    tiltT += dt/TILT_DUR;
    const tt=tiltT>=1?1:tiltT;
    const e=1-Math.pow(1-tt,3);
    prismAngle = tiltFrom+(targetAngle-tiltFrom)*e;
    if(tiltT>=1){ prismAngle=targetAngle; animating=false; }
    prism.rotation.x=prismAngle;
  }
  if(anim){
    anim.t += dt/anim.dur;
    const tt=anim.t>=1?1:anim.t;
    const e=1-Math.pow(1-tt,3);
    for(const it of anim.items){
      it.mesh.position.x = it.from.x+(it.to.x-it.from.x)*e;
      it.mesh.position.y = it.from.y+(it.to.y-it.from.y)*e;
      if(it.fade){ it.mesh.traverse(o=>{ if(o.material&&o.material.opacity!==undefined){ o.material.transparent=true; o.material.opacity=Math.max(0,1-tt); } }); }
    }
    if(anim.t>=1){ const after=anim.after; anim=null; after&&after(); }
  }
  if(sliding){
    slideT += dt/MOVE_DUR/2.2;
    const tt=slideT>=1?1:slideT;
    const e=1-Math.pow(1-tt,3);
    const vertical=(slideDir==='up'||slideDir==='down');
    const holder=cellMeshes[slideFace];
    if(vertical){ const sign=(slideDir==='down')?-1:1; if(holder){ holder.position.y=sign*CELL_W*e; holder.position.x=0; } }
    else        { const sign=(slideDir==='right')?1:-1; if(holder){ holder.position.x=sign*CELL_W*e; holder.position.y=0; } }
    if(slideT>=1){
      commitScroll(slideFace, slideFresh, slideDir);
      if(holder){ holder.position.x=0; holder.position.y=0; }
      renderBoard(slideFace, prism.children[slideFace]);
      sliding=false; slideFresh=null;
      const after=slideAfter; slideAfter=null; after&&after();
    }
  }
  renderer.render(scene,camera);
}

buildBoards(); fit(); lastT=performance.now(); requestAnimationFrame(animate);
</script>
</body>
</html>
